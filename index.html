<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Manan Kakkar. Computer Science student at the University of Toronto and incoming Software Engineer Intern at AMD. Robotics, systems, and full-stack work."
    />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <title>Manan Kakkar</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Manan Kakkar" />
    <meta
      property="og:description"
      content="Robotics software and systems. Continuum-robot kinematics, a Unix shell in C, production backends. Incoming SWE intern at AMD."
    />
    <meta property="og:url" content="https://manankakkar.com" />
    <meta property="og:image" content="https://manankakkar.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Manan Kakkar" />
    <meta
      name="twitter:description"
      content="Robotics software and systems. Incoming SWE intern at AMD."
    />
    <meta name="twitter:image" content="https://manankakkar.com/og.png" />
    <script>
      // Set the theme before paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
